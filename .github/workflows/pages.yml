# Publishes the site to GitHub Pages on every push to main.
# Pages is set to the "GitHub Actions" source, which publishes only through a workflow like this one.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a publication still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Browsers keep styles.css and script.js for 10 minutes; a version per commit makes them load the new files with the new page.
      - run: sed -i "s/\(styles\.css\|script\.js\)\"/\1?v=${GITHUB_SHA::7}\"/g" index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
